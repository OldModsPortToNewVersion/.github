name: Проверка оформления

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка источников, SVG и анимаций
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Воспроизводимая офлайн-сборка
        run: |
          python scripts/build_cover.py
          git diff --exit-code -- profile/assets/legacy-dark.svg profile/assets/legacy-light.svg
